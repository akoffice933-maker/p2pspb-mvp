apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: p2pspb
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'api'
        static_configs:
          - targets: ['api:4000']
        metrics_path: '/metrics'

      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']

      - job_name: 'node'
        static_configs:
          - targets: ['node-exporter:9100']
